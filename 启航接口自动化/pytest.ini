[pytest]
log_file = ./log/test.log
log_file_level = info
log_file_format = %(asctime)s %(levelname)s [文件:%(filename)-18s] %(message)s [行号:%(lineno)-4d]
log_file_date_format = %Y-%m-%d %H:%M:%S
addopts = -s --alluredir report --clean-alluredir
testpaths = ./testcases
python_files = test*.py
python_classes = Test*
python_functions = test*